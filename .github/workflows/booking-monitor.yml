name: Booking funnel safety checks
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: booking-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public pages, assets, calendar, and safe validation paths
        id: checks
        continue-on-error: true
        run: node scripts/monitor-booking.mjs
      - name: Publish incident or daily report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = fs.existsSync('booking-monitor-result.json') ? JSON.parse(fs.readFileSync('booking-monitor-result.json', 'utf8')) : {ok: false, results: [{name: 'Monitor execution', ok: false, error: 'No result produced'}]};
            const {owner, repo} = context.repo;
            const title = '[Booking monitor] Active incident';
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'open', per_page: 100});
            const incident = issues.find(issue => !issue.pull_request && issue.title === title && issue.user.login === 'github-actions[bot]');
            const body = `Checked: ${new Date().toISOString()}\n\n` + result.results.map(item => `${item.ok ? 'PASS' : 'FAIL'}: ${item.name}${item.error ? ' — ' + item.error : ''}`).join('\n') + '\n\n' + (result.limitations || '') + `\n\nRun: https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            if (!result.ok && !incident) await github.rest.issues.create({owner, repo, title, body});
            if (result.ok && incident) {
              await github.rest.issues.createComment({owner, repo, issue_number: incident.number, body: 'Recovered.\n\n' + body});
              await github.rest.issues.update({owner, repo, issue_number: incident.number, state: 'closed'});
            }
            const date = new Date().toISOString().slice(0, 10);
            const dailyTitle = `[Booking monitor] Daily report ${date}`;
            if (!issues.some(issue => issue.title === dailyTitle)) {
              await github.rest.issues.create({owner, repo, title: dailyTitle, body});
            }
            await core.summary.addRaw(body).write();
            if (!result.ok) core.setFailed('Booking health check failed. See incident report.');
